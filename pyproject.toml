[project]
name = "profon"
version = "0.1.0"
description = "Assistente de planejamento de aulas para professor"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21",
    "anthropic>=0.40",
    "google-genai>=1",
    "pypdf>=5",
    "pyyaml>=6",
    "python-dotenv>=1",
    "tzdata",  # fuso America/Fortaleza no Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["profon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
