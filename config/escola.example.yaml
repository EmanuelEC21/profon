# Modelo de configuração do Profon.
# Copie para config/escola.yaml e preencha com os dados reais.
# As datas abaixo são um exemplo do ano letivo de 2027. Substitua pelo calendário oficial da escola.

professor: Nome do Professor
escola: Nome da Escola
coordenador: Nome do Coordenador
disciplina: Língua Portuguesa
horario_envio: "06:00"          # hora da mensagem da manhã
provedor_ia: gemini              # gemini (grátis, chave do aistudio.google.com) ou claude
# modelo_ia: gemini-flash-latest  # opcional; sem esta linha usa o padrão do provedor (claude: claude-opus-5-5)
telegram_chat_id: 0             # o bot mostra esse número no /start

bimestres:
  - {numero: 1, inicio: 2027-02-08, fim: 2027-04-16}
  - {numero: 2, inicio: 2027-04-26, fim: 2027-07-09}
  - {numero: 3, inicio: 2027-07-26, fim: 2027-10-01}
  - {numero: 4, inicio: 2027-10-04, fim: 2027-12-15}

# Dias sem aula que já se sabe de antemão (feriados, recessos, conselhos de classe).
dias_sem_aula:
  2027-02-08: Carnaval
  2027-02-09: Carnaval
  2027-02-10: Quarta-feira de Cinzas
  2027-04-21: Tiradentes
  2027-05-27: Corpus Christi
  2027-07-28: Adesão do Maranhão à Independência
  2027-09-07: Independência
  2027-10-12: Nossa Senhora Aparecida
  2027-11-02: Finados
  2027-11-15: Proclamação da República

# dias_semana: 0 = segunda, 1 = terça, 2 = quarta, 3 = quinta, 4 = sexta.
# Aula geminada (duas seguidas) conta como um dia só.
turmas:
  - {id: 1A, ano: 1, nome: 1º A, turno: manhã, dias_semana: [0, 2, 4]}
  - {id: 5A, ano: 5, nome: 5º A, turno: manhã, dias_semana: [0, 1, 3]}
  - {id: 6A, ano: 6, nome: 6º A, turno: manhã, dias_semana: [0, 2, 3]}
  - {id: 9A, ano: 9, nome: 9º A, turno: tarde, dias_semana: [0, 1, 4]}
